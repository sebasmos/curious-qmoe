# configs.yaml
defaults:
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled

hydra:
  run:
    dir: ./outputs/${experiment.metadata.tag}
  output_subdir: null

experiment:
  models_to_run: [esc]
  device: "mps"  # or "cuda", "mps", or "cpu"
  track_emissions: false  # Set to true to enable carbon tracking (requires sudo on macOS)
  datasets:
    esc:
      csv: /Users/cajas.sebastian/Documents/DATASETS/Urban8k/efficientnet/urbansound8k.csv
      # imgs (mel spectrograms) is not read by benchmark.py; kept for reference only
      normalization_type: "standard" # "l2" # or "standard", "min_max", "raw"

  model:
    batch_size: 64
    hidden_sizes: [640, 320]
    learning_rate: 0.0005793146438537801
    dropout_prob:  0.1953403862875243
    epochs: 100
    early_stopping:
      patience: 19  
      delta: 0.01
    weight_decay: 0.0051275736171219844
    label_smoothing: 0.10851194368924916
    patience: 15
    factor: 0.6156433661410728
  
  router:
    expert_quantizations: [1, 2, 4, 16]
    early_stopping:
      patience: 30
      delta: 0.001
    num_experts: 4
    top_k: 1
    hidden_dim: 128
    dropout_prob: 0.2
    epochs: 150
    lr_moe_train: 1e-3
    batch_size: 256
    weight_decay: 1e-4
    load_balancing: true
    load_balancing_alpha: 1e-3
    diversity_loss_enabled: false  # Default to False, can be enabled in the config
    diversity_loss_alpha: 1e-3  # New parameter for diversity loss
    use_curiosity: false  # Enable BayesianRouter with Monte Carlo Dropout for epistemic uncertainty estimation
    curiosity_strategy: "precision_prior"  # the published method; ablations: "kl_divergence" (polarization-only), "entropy_regularization", "precision_sharp", "escalation", "soft_escalation"
    curiosity_alpha: 1.0  # strength of the precision prior (α in Equation 8); the published setting
    mc_samples: 10  # Monte Carlo samples for uncertainty estimation
    # List of bit-widths for each expert
    # expert_quantizations: [1, 1, 1, 1]
    
  cross_validation:
    n_splits: 5
    shuffle: true
    random_seed: 42
    validation_split_ratio: 0.1

  logging:
    log_interval: 50
    save_checkpoint: true
    resume: true

  metadata:
    tag: "EfficientNet_urban8k_1536"
    notes: ""

    